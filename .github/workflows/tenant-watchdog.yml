name: 24/7 Tenant Watchdog & Self-Healing

on:
  schedule:
    # Run every 30 minutes 24/7
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Tenant Watchdog & Self-Healing
        run: |
          response=$(curl -s -w "\n%{http_code}" https://saha-takip-beige.vercel.app/api/tenant-watchdog)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Status: $http_code"
          echo "Body: $body"
          if [ "$http_code" -ne 200 ]; then
            echo "Watchdog reported non-200 status code: $http_code"
            exit 1
          fi
